<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup - FLAVOR Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .content-wrapper {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 8px;
        }
        .content-wrapper .grid-area {
            flex: 1;
            padding: 80px;
        }
        .flavor-area {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            padding: 16px;
            overflow: hidden;
        }
        .flavor-tile {
            flex-shrink: 0;
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-cell-empty);
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .flavor-tile img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        .flavor-tile.empty {
            opacity: 0.3;
        }
        .flavor-text {
            flex: 1;
            margin-top: 12px;
            padding: 12px;
            background-color: var(--bg-cell-empty);
            border: 1px dashed var(--border-light);
            border-radius: var(--radius-sm);
            font-family: 'Crimson Text', serif;
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            overflow-y: auto;
        }
        .flavor-text .label {
            font-weight: 700;
            color: var(--text-primary);
        }
        /* Overlay controls — positioned by JS, just need base styles */
        .ctrl.top-group { flex-direction: row; }
        .ctrl.bottom-group { flex-direction: row; }
        .ctrl.left-group { flex-direction: column; }
        .ctrl.right-group { flex-direction: column; }
    </style>
</head>
<body>
    <div class="app">
        <div class="controls">
            <select id="tileFolderSelect">
                <option value="">Sélectionnez un dossier de tuiles</option>
            </select>
            <button id="zoomOut">-</button>
            <span id="zoomDisplay">70%</span>
            <button id="zoomIn">+</button>
            <button id="themeToggle" title="Basculer entre thème clair et sombre">☀️</button>
            <div class="grid-dimensions">
                <label for="gridColumns">Colonnes:</label>
                <input type="number" id="gridColumns" min="1" max="20" value="7">
                <span>x</span>
                <label for="gridRows">Lignes:</label>
                <input type="number" id="gridRows" min="1" max="20" value="8">
                <button id="setGridDimensions">Valider</button>
                <button id="exportDungeon" title="Exporter le donjon">⬇</button>
                <button id="importDungeon" title="Importer un donjon">⬆</button>
            </div>
        </div>

        <div class="content-wrapper">
            <div class="grid-area">
                <div class="ctrl top-group show">
                    <button class="remove" data-action="removeRowTop" data-tip="Supprimer la première ligne">−</button>
                    <button data-action="addRowTop" data-tip="Ajouter une ligne au-dessus">+</button>
                </div>
                <div class="ctrl bottom-group show">
                    <button class="remove" data-action="removeRowBottom" data-tip="Supprimer la dernière ligne">−</button>
                    <button data-action="addRowBottom" data-tip="Ajouter une ligne en dessous">+</button>
                </div>
                <div class="ctrl left-group show">
                    <button data-action="addColLeft" data-tip="Ajouter une colonne à gauche">+</button>
                    <button class="remove" data-action="removeColLeft" data-tip="Supprimer la première colonne">−</button>
                </div>
                <div class="ctrl right-group show">
                    <button data-action="addColRight" data-tip="Ajouter une colonne à droite">+</button>
                    <button class="remove" data-action="removeColRight" data-tip="Supprimer la dernière colonne">−</button>
                </div>
                <div class="grid-container" id="gridContainer"></div>
            </div>

            <div class="flavor-area">
                <div class="flavor-tile">
                    <img src="tileswebp/donjon/tile_96.webp" alt="Tuile">
                </div>
                <div class="flavor-text">
                    <div><span class="label">Chemin :</span> donjon/tile_96</div>
                    <div><span class="label">Rotation :</span> 0°</div>
                </div>
            </div>
        </div>

        <div class="debug-container">
            <h3>Journal de debug</h3>
            <textarea id="debugLog" readonly rows="6"></textarea>
        </div>
    </div>

    <script>
        // Mock: créer une grille de démo avec une tuile
        (function() {
            const grid = document.getElementById('gridContainer');
            const cols = 7, rows = 8;
            grid.style.gridTemplateColumns = `repeat(${cols}, 55px)`;
            grid.style.gridTemplateRows = `repeat(${rows}, 55px)`;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell empty';
                    if (r === 3 && c === 3) {
                        const img = document.createElement('img');
                        img.src = 'tileswebp/donjon/tile_96.webp';
                        img.alt = 'Tuile 96';
                        cell.appendChild(img);
                        cell.classList.remove('empty');
                    }
                    grid.appendChild(cell);
                }
            }

            // Position overlay controls like the real app
            function positionOverlays() {
                const gridArea = document.querySelector('.grid-area');
                const gridContainer = document.getElementById('gridContainer');
                const areaRect = gridArea.getBoundingClientRect();
                const gridRect = gridContainer.getBoundingClientRect();

                const gLeft = gridRect.left - areaRect.left + gridArea.scrollLeft;
                const gTop = gridRect.top - areaRect.top + gridArea.scrollTop;
                const gWidth = gridRect.width;
                const gHeight = gridRect.height;
                const midX = gLeft + gWidth / 2;
                const midY = gTop + gHeight / 2;

                const topGroup = gridArea.querySelector('.top-group');
                const bottomGroup = gridArea.querySelector('.bottom-group');
                const leftGroup = gridArea.querySelector('.left-group');
                const rightGroup = gridArea.querySelector('.right-group');

                if (topGroup) {
                    topGroup.style.top = (gTop - 36) + 'px';
                    topGroup.style.left = midX + 'px';
                    topGroup.style.transform = 'translateX(-50%)';
                }
                if (bottomGroup) {
                    bottomGroup.style.top = (gTop + gHeight + 10) + 'px';
                    bottomGroup.style.left = midX + 'px';
                    bottomGroup.style.transform = 'translateX(-50%)';
                }
                if (leftGroup) {
                    leftGroup.style.top = midY + 'px';
                    leftGroup.style.left = (gLeft - 36) + 'px';
                    leftGroup.style.transform = 'translateY(-50%)';
                }
                if (rightGroup) {
                    rightGroup.style.top = midY + 'px';
                    rightGroup.style.left = (gLeft + gWidth + 10) + 'px';
                    rightGroup.style.transform = 'translateY(-50%)';
                }
            }

            requestAnimationFrame(positionOverlays);
            window.addEventListener('resize', positionOverlays);
        })();
    </script>
</body>
</html>
