<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Draw My Dungeon - Générateur de Donjons</title>
    <link rel="stylesheet" href="style.css">
    <script>
        (function() {
            const saved = localStorage.getItem('dmd-theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <!-- IMPORT DES ICONES MATERIAL SYMBOLS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <div class="controls">
        <select id="tileFolderSelect">
            <option value="">Sélectionnez un dossier de tuiles</option>
        </select>
        <button id="zoomOut">-</button>
        <span id="zoomDisplay">70%</span>
        <button id="zoomIn">+</button>
        <button id="themeToggle" title="Basculer entre thème clair et sombre">☀️</button>
        <!-- Nouveau bouton d'export -->
        <button id="exportPdf" style="display: none;">Exporter en PDF</button>
        <!-- Nouveaux champs pour les dimensions de la grille -->
        <div class="grid-dimensions">
            <label for="gridColumns">Colonnes:</label>
            <input type="number" id="gridColumns" min="1" max="20" value="6">
            <span>x</span>
            <label for="gridRows">Lignes:</label>
            <input type="number" id="gridRows" min="1" max="20" value="8">
            <button id="setGridDimensions">Valider</button>
        </div>
    </div>
    
    <div class="grid-wrapper">
        <!-- Overlays d'ajout (hors zone scroll, toujours visibles) -->
        <div class="grid-overlay-add grid-overlay-add-top" data-action="add-row-top" title="Ajouter une ligne en haut">+</div>
        <div class="grid-overlay-add grid-overlay-add-left" data-action="add-col-left" title="Ajouter une colonne à gauche">+</div>
        <div class="grid-overlay-add grid-overlay-add-right" data-action="add-col-right" title="Ajouter une colonne à droite">+</div>
        <div class="grid-overlay-add grid-overlay-add-bottom" data-action="add-row-bottom" title="Ajouter une ligne en bas">+</div>

        <!-- Zone scrollable contenant la grille et les overlays de suppression -->
        <div class="grid-scroll-area" id="gridScrollArea">
            <div class="grid-overlay-remove grid-overlay-remove-top" data-action="remove-row-top" title="Supprimer la première ligne">−</div>
            <div class="grid-overlay-remove grid-overlay-remove-left" data-action="remove-col-left" title="Supprimer la première colonne">−</div>
            <div class="grid-overlay-remove grid-overlay-remove-right" data-action="remove-col-right" title="Supprimer la dernière colonne">−</div>
            <div class="grid-overlay-remove grid-overlay-remove-bottom" data-action="remove-row-bottom" title="Supprimer la dernière ligne">−</div>
            <div class="grid-container" id="gridContainer">
                <!-- La grille sera générée dynamiquement par JavaScript -->
            </div>
        </div>
    </div>

    

    <div class="debug-container">
        <h3>Journal de debug</h3>
        <textarea id="debugLog" readonly rows="10" style="width: 100%;"></textarea>
    </div>
    
    <!-- Nouvel élément Tooltip -->
    <div id="customTooltip"></div>
    
     <!-- IMPORTANT : Ajouter ces scripts AVANT script.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- IMPORTANT : L'ordre de ces deux lignes est crucial -->
    <!-- 1. On charge d'abord les DONNÉES -->
    <script src="tile_configuration.js"></script>
    <!-- 2. On charge ensuite le MOTEUR (qui va utiliser les données) -->
    <script src="script.js"></script>

    <!-- Script pour gérer la visibilité du bouton export selon le protocole -->
    <script>
        (function() {
            const exportBtn = document.getElementById('exportPdf');
            // On vérifie si le protocole n'est PAS 'file:'
            if (window.location.protocol !== 'file:') {
                exportBtn.style.display = 'inline-block';
            } else {
                // On s'assure qu'il reste caché si on est en local
                exportBtn.style.display = 'none';
            }
        })();
    </script>

<!-- Modale de choix de collision -->
<div id="collisionModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Case occupée</h3>
        <p>Que souhaitez-vous faire avec cette tuile ?</p>
        <div class="modal-options">
            <button id="modalOverwrite" class="modal-btn">Écraser la tuile</button>
            <button id="modalSwap" class="modal-btn">Échanger les deux</button>
        </div>
        <button id="modalCancel" class="modal-btn-cancel">Annuler</button>
    </div>
</div>
</body>
</html>
