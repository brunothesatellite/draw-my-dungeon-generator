<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup — Grid Overlay Controls</title>
<style>
  :root{--grid-pad:44px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px}

  h1{font-size:14px;font-weight:400;color:#666;margin-bottom:24px;letter-spacing:.5px;text-transform:uppercase}

  .grid-wrapper{position:relative;padding:var(--grid-pad)}

  .grid{
    display:grid;
    grid-template-columns:repeat(6,72px);
    grid-template-rows:repeat(5,72px);
    gap:4px;
    background:#252540;
    border:2px solid #3a3a5c;
    border-radius:6px;
  }
  .cell{background:#2e2e4a;border-radius:3px;transition:background .15s}
  .cell:hover{background:#38385a}

  /* ── Shared overlay base ── */
  .ov{
    position:absolute;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    width:26px;height:26px;
    font-size:16px;font-weight:700;line-height:1;
    cursor:pointer;
    opacity:0;pointer-events:none;
    transition:opacity .15s,transform .15s,background .15s;
    z-index:10;user-select:none;
    color:#ccc;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
  }
  .ov.show{opacity:1;pointer-events:auto}
  .ov:hover{transform:scale(1.15);background:rgba(255,255,255,.18);color:#fff}
  .ov:active{transform:scale(.92)}

  .ov.remove:hover{
    background:rgba(220,60,60,.35);
    border-color:rgba(220,60,60,.5);color:#f88;
  }

  /* ── Tooltip ── */
  .ov[data-tip]::after{
    content:attr(data-tip);position:absolute;white-space:nowrap;
    font-size:11px;font-weight:500;padding:4px 8px;border-radius:4px;
    background:rgba(0,0,0,.85);color:#ddd;pointer-events:none;
    opacity:0;transition:opacity .15s;z-index:20;
  }
  .ov[data-tip]:hover::after{opacity:1}

  /* tooltips per edge */
  .ov.tip-top::after   {bottom:calc(100% + 8px);left:50%;transform:translateX(-50%)}
  .ov.tip-bottom::after{top:calc(100% + 8px);left:50%;transform:translateX(-50%)}
  .ov.tip-left::after  {right:calc(100% + 8px);top:50%;transform:translateY(-50%)}
  .ov.tip-right::after {left:calc(100% + 8px);top:50%;transform:translateY(-50%)}

  /* ── Position each button individually on its edge ── */

  /* TOP edge: + left side, − right side */
  .ov.add.top   {top:9px;left:var(--grid-pad)}
  .ov.remove.top{top:9px;right:var(--grid-pad)}

  /* BOTTOM edge: + left side, − right side */
  .ov.add.bottom   {bottom:9px;left:var(--grid-pad)}
  .ov.remove.bottom{bottom:9px;right:var(--grid-pad)}

  /* LEFT edge: + top side, − bottom side */
  .ov.add.left   {left:9px;top:var(--grid-pad)}
  .ov.remove.left{left:9px;bottom:var(--grid-pad)}

  /* RIGHT edge: + top side, − bottom side */
  .ov.add.right   {right:9px;top:var(--grid-pad)}
  .ov.remove.right{right:9px;bottom:var(--grid-pad)}

  .info{margin-top:28px;font-size:12px;color:#555;text-align:center;line-height:1.6}
</style>
</head>
<body>

<h1>Grid Overlay Controls — Mockup</h1>

<div class="grid-wrapper" id="wrapper">
  <!-- TOP -->
  <div class="ov add top tip-top"    data-action="add-top"    data-tip="Add row above">+</div>
  <div class="ov remove top tip-top" data-action="remove-top" data-tip="Remove first row">−</div>
  <!-- BOTTOM -->
  <div class="ov add bottom tip-bottom"    data-action="add-bottom"    data-tip="Add row below">+</div>
  <div class="ov remove bottom tip-bottom" data-action="remove-bottom" data-tip="Remove last row">−</div>
  <!-- LEFT -->
  <div class="ov add left tip-left"    data-action="add-left"    data-tip="Add column left">+</div>
  <div class="ov remove left tip-left" data-action="remove-left" data-tip="Remove first column">−</div>
  <!-- RIGHT -->
  <div class="ov add right tip-right"    data-action="add-right"    data-tip="Add column right">+</div>
  <div class="ov remove right tip-right" data-action="remove-right" data-tip="Remove last column">−</div>

  <div class="grid" id="grid"></div>
</div>

<div class="info">
  Hover near a grid edge → the <b>+</b> and <b>−</b> for that edge appear, spread apart<br>
  Clicking does nothing in this mockup
</div>

<script>
const wrapper   = document.getElementById('wrapper');
const grid      = document.getElementById('grid');
const ovs       = document.querySelectorAll('.ov');
const THRESHOLD = 48;

function gridRect(){
  const r = grid.getBoundingClientRect();
  const w = wrapper.getBoundingClientRect();
  return {top:r.top-w.top, bottom:r.bottom-w.top, left:r.left-w.left, right:r.right-w.left};
}

wrapper.addEventListener('mousemove', e => {
  const r = gridRect();
  const w = wrapper.getBoundingClientRect();
  const x = e.clientX - w.left;
  const y = e.clientY - w.top;

  const nearTop    = y >= r.top    - THRESHOLD && y <= r.top    + THRESHOLD;
  const nearBottom = y >= r.bottom - THRESHOLD && y <= r.bottom + THRESHOLD;
  const nearLeft   = x >= r.left   - THRESHOLD && x <= r.left   + THRESHOLD;
  const nearRight  = x >= r.right  - THRESHOLD && x <= r.right  + THRESHOLD;

  ovs.forEach(ov => {
    const a = ov.dataset.action;
    let show = false;
    if (a==='add-top'&&nearTop || a==='remove-top'&&nearTop) show=true;
    if (a==='add-bottom'&&nearBottom || a==='remove-bottom'&&nearBottom) show=true;
    if (a==='add-left'&&nearLeft || a==='remove-left'&&nearLeft) show=true;
    if (a==='add-right'&&nearRight || a==='remove-right'&&nearRight) show=true;
    ov.classList.toggle('show', show);
  });
});

wrapper.addEventListener('mouseleave', () => {
  ovs.forEach(ov => ov.classList.remove('show'));
});

for (let i = 0; i < 30; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  grid.appendChild(c);
}
</script>
</body>
</html>
